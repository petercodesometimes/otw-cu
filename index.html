<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OTW CU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles/main.css" />
  <!-- Leaflet map library; the app falls back to a drawn schematic if it can't load. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <header class="topbar">
    <a class="brand" href="#today">OTW CU</a>
    <nav class="tabs">
      <button data-tab="today">Today</button>
      <button data-tab="ahead">Plan ahead</button>
      <button data-tab="errands">Errands</button>
      <button data-tab="classes">Classes</button>
      <button data-tab="map">Map</button>
      <button data-tab="walk">Walk together</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <span class="pill static" id="headerdate"></span>
  </header>
  <main>
    <section id="today"></section>
    <section id="ahead" class="hidden"></section>
    <section id="errands" class="hidden"></section>
    <section id="classes" class="hidden"></section>
    <section id="map" class="hidden"></section>
    <section id="walk" class="hidden"></section>
    <section id="settings" class="hidden"></section>
    <section id="plan" class="hidden"></section>
  </main>
  <script type="module" src="src/main.js"></script>
</html>
