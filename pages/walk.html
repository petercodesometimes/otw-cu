<header class="pagehead">
  <h1>Walk together</h1>
  <p class="meta">Opt-in, shows first name only.</p>
</header>
<div class="layout">
  <div class="col-main">
    <div class="card window solid" id="nextwalk"></div>
    <div id="buddies"></div>
    <div class="card dashed">
      <h3>Make friends</h3>
      <p class="meta">Shared classes, interests, and walking times · coming soon</p>
    </div>
  </div>
  <aside class="col-side">
    <div class="card">
      <h3>Privacy</h3>
      <p class="meta settingsline">
        Show me to matches: <button class="pill" id="showme"></button>
        · Meet in public spots only: <button class="pill" id="publicspots"></button>
      </p>
    </div>
    <button class="primary" id="buddiescta">Find walking buddies</button>
    <p class="meta" id="walknote" role="status"></p>
  </aside>
</div>
